<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chessing — Minimalist Online Chess</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chess.js for 100% compliant chess rules & legal move validation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- PeerJS for Serverless P2P Multiplayer (Private Rooms, Spectators & Random Queue) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-primary: #0c0d10;
      --bg-secondary: #13151a;
      --bg-tertiary: #1b1e26;
      --border-color: #262932;
      --text-primary: #eceef2;
      --text-secondary: #8b909e;
      --accent: #e5e7eb;
      --accent-text: #0c0d10;
      --accent-hover: #ffffff;
      --sq-light: #e8e4dc;
      --sq-dark: #7a6a58;
      --sq-highlight: rgba(217, 160, 91, 0.45);
      --sq-lastmove: rgba(217, 160, 91, 0.30);
    }

    html.light {
      --bg-primary: #f6f6f4;
      --bg-secondary: #ffffff;
      --bg-tertiary: #efefe9;
      --border-color: #dcdcd5;
      --text-primary: #141518;
      --text-secondary: #686b73;
      --accent: #141518;
      --accent-text: #ffffff;
      --accent-hover: #2b2d33;
      --sq-light: #ede9e0;
      --sq-dark: #857461;
      --sq-highlight: rgba(202, 138, 4, 0.38);
      --sq-lastmove: rgba(202, 138, 4, 0.24);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease,
                  border-color 0.25s ease,
                  color 0.2s ease;
    }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-mono-clock {
      font-family: 'JetBrains Mono', monospace;
    }

    .surface-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
    }

    .surface-sub {
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      transition: background-color 0.18s ease, transform 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }
    .btn-primary:active:not(:disabled) {
      transform: scale(0.99);
    }

    .btn-secondary {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.15s ease;
    }
    .btn-secondary:hover:not(:disabled) {
      border-color: var(--text-secondary);
    }
    .btn-secondary:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* View Transitions */
    .view-panel {
      animation: viewEnter 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes viewEnter {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Modal Smooth Entrance */
    .modal-backdrop {
      animation: fadeBackdrop 0.2s ease forwards;
    }
    .modal-box {
      animation: modalSpring 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalSpring {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Chessboard Styling */
    .board-wrapper {
      width: 100%;
      max-width: min(86vw, 520px);
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .chess-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }

    .square.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--sq-highlight);
      pointer-events: none;
    }

    .square.last-move::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--sq-lastmove);
      pointer-events: none;
    }

    .square.in-check {
      background: radial-gradient(circle, rgba(220, 38, 38, 0.85) 0%, rgba(185, 28, 28, 0.45) 75%, transparent 100%) !important;
    }

    .legal-dot {
      width: 24%;
      height: 24%;
      border-radius: 9999px;
      background-color: rgba(20, 21, 24, 0.28);
      pointer-events: none;
      z-index: 2;
    }

    .legal-capture-ring {
      position: absolute;
      inset: 9%;
      border-radius: 9999px;
      border: 3px solid rgba(20, 21, 24, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    .piece-svg {
      width: 82%;
      height: 82%;
      z-index: 3;
      pointer-events: none;
      will-change: transform;
    }

    /* Flying Piece Overlay Layer for Smooth Move Gliding */
    .anim-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .coord-rank {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      opacity: 0.8;
      pointer-events: none;
    }

    .coord-file {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      opacity: 0.8;
      pointer-events: none;
    }

    .text-sq-dark { color: #5c4f42; }
    .text-sq-light { color: #e8e4dc; }

    /* Audio Equalizer Bars */
    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      width: 13px;
    }
    .eq-bars span {
      display: block;
      width: 2px;
      height: 3px;
      background-color: currentColor;
      transition: height 0.2s ease;
    }
    .eq-active span:nth-child(1) { animation: eqBounce 0.9s ease-in-out infinite alternate; }
    .eq-active span:nth-child(2) { animation: eqBounce 0.65s ease-in-out 0.2s infinite alternate; }
    .eq-active span:nth-child(3) { animation: eqBounce 0.8s ease-in-out 0.4s infinite alternate; }
    .eq-active span:nth-child(4) { animation: eqBounce 0.7s ease-in-out 0.1s infinite alternate; }

    @keyframes eqBounce {
      0% { height: 3px; }
      100% { height: 11px; }
    }
  </style>
</head>
<body class="flex flex-col justify-between">

  <!-- Top Navigation Bar -->
  <header class="w-full border-b" style="border-color: var(--border-color); background-color: var(--bg-secondary);">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <button onclick="returnToMenu()" class="flex items-center gap-2.5 text-left focus:outline-none">
        <div class="w-8 h-8 rounded-md flex items-center justify-center border"
             style="background-color: var(--bg-tertiary); border-color: var(--border-color); color: var(--text-primary);">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 22H5v-2h14v2M17.16 8.26A8.96 8.96 0 0 0 11 4.13V2H9v2.13c-1.89.38-3.5 1.49-4.47 3.05L3 9.7l1.73 1 1.45-2.32c.54-.86 1.45-1.45 2.47-1.59L7.5 11.5 6 18h12l-1.5-6.5 1.95-1.85c.4-.38.52-.97.28-1.47l-.57-1.15Z"/>
          </svg>
        </div>
        <div>
          <span class="font-semibold text-base tracking-tight block leading-none">Chessing</span>
          <span class="text-[11px]" style="color: var(--text-secondary);">ekkman.site</span>
        </div>
      </button>

      <!-- Right Controls: Music Toggle, Theme Switch -->
      <div class="flex items-center gap-2">
        <button id="musicToggleBtn" aria-label="Toggle chill background music" title="Chill Background Music"
          class="btn-secondary rounded-md px-3 py-1.5 text-xs font-medium inline-flex items-center gap-2">
          <span id="musicEq" class="eq-bars eq-active">
            <span></span><span></span><span></span><span></span>
          </span>
          <span id="musicBtnLabel" class="hidden sm:inline">Music: On</span>
        </button>

        <button id="themeToggleBtn" aria-label="Toggle light or dark theme" title="Switch Light / Dark Mode"
          class="btn-secondary rounded-md px-3 py-1.5 text-xs font-medium inline-flex items-center gap-1.5">
          <span id="themeIcon" class="inline-flex items-center">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          </span>
          <span id="themeLabel" class="hidden sm:inline">Light</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Application Container -->
  <main class="flex-1 flex items-center justify-center p-4">

    <!-- VIEW 1: MAIN LOBBY / MENU -->
    <section id="viewLobby" class="view-panel w-full max-w-sm space-y-3">
      <div class="surface-card rounded-xl p-6 space-y-5">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Chessing</h1>
        </div>

        <div class="space-y-2.5">
          <button id="btnQueue" class="btn-primary w-full py-3 px-4 rounded-lg font-medium text-sm flex items-center justify-between">
            <span>Play Online</span>
            <span class="text-xs opacity-75 font-mono-clock">10m</span>
          </button>

          <button id="btnOpenCreate" class="btn-secondary w-full py-3 px-4 rounded-lg font-medium text-sm flex items-center justify-between">
            <span>Create Private Room</span>
            <span class="text-xs" style="color: var(--text-secondary);">Custom</span>
          </button>

          <button id="btnLocalMode" class="btn-secondary w-full py-3 px-4 rounded-lg font-medium text-sm flex items-center justify-between">
            <span>Pass &amp; Play</span>
            <span class="text-xs" style="color: var(--text-secondary);">Local</span>
          </button>
        </div>

        <div class="pt-3 border-t" style="border-color: var(--border-color);">
          <label class="block text-xs font-medium mb-2" style="color: var(--text-secondary);">Join by Room Code</label>
          <div class="flex gap-2">
            <input id="joinCodeInput" type="text" maxlength="8" placeholder="K7X9P2"
              class="w-full px-3 py-2 rounded-lg text-sm font-mono-clock uppercase focus:outline-none surface-sub"
              style="color: var(--text-primary);" />
            <button id="btnJoinCode" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium">
              Join
            </button>
          </div>
        </div>
      </div>

      <div id="toastBox" class="hidden rounded-lg px-3.5 py-2.5 text-xs font-medium text-center border"
           style="background-color: var(--bg-secondary); border-color: var(--border-color); color: var(--text-primary);">
      </div>
    </section>

    <!-- VIEW 2: CREATE ROOM MODAL / CARD -->
    <section id="viewCreateRoom" class="view-panel hidden w-full max-w-sm">
      <div class="surface-card rounded-xl p-6 space-y-5">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold">Create Private Room</h2>
          <button onclick="returnToMenu()" class="text-xs font-medium px-2.5 py-1 rounded-md surface-sub hover:opacity-80">Back</button>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-medium" style="color: var(--text-secondary);">Side</label>
          <div class="grid grid-cols-3 gap-2" id="colorChoiceGroup">
            <button type="button" data-color="w" class="color-opt active-opt py-2.5 px-2 rounded-lg border text-center"
                    style="border-color: var(--text-primary); background-color: var(--bg-tertiary);">
              <div class="w-3.5 h-3.5 rounded-full bg-white border border-neutral-400 mx-auto mb-1"></div>
              <div class="text-xs font-medium">White</div>
            </button>
            <button type="button" data-color="random" class="color-opt py-2.5 px-2 rounded-lg border text-center"
                    style="border-color: var(--border-color); background-color: var(--bg-tertiary);">
              <div class="w-3.5 h-3.5 rounded-full mx-auto mb-1 border border-neutral-400" style="background: linear-gradient(90deg, #fff 50%, #181b22 50%);"></div>
              <div class="text-xs font-medium">Random</div>
            </button>
            <button type="button" data-color="b" class="color-opt py-2.5 px-2 rounded-lg border text-center"
                    style="border-color: var(--border-color); background-color: var(--bg-tertiary);">
              <div class="w-3.5 h-3.5 rounded-full bg-neutral-900 border border-neutral-400 mx-auto mb-1"></div>
              <div class="text-xs font-medium">Black</div>
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-medium" style="color: var(--text-secondary);">Minutes per side</label>
          <div class="grid grid-cols-4 gap-2" id="timeChoiceGroup">
            <button type="button" data-time="180" class="time-opt py-2 rounded-lg border text-xs font-medium font-mono-clock"
                    style="border-color: var(--border-color); background-color: var(--bg-tertiary);">3</button>
            <button type="button" data-time="300" class="time-opt py-2 rounded-lg border text-xs font-medium font-mono-clock"
                    style="border-color: var(--border-color); background-color: var(--bg-tertiary);">5</button>
            <button type="button" data-time="600" class="time-opt active-time py-2 rounded-lg border text-xs font-medium font-mono-clock"
                    style="border-color: var(--text-primary); background-color: var(--bg-tertiary);">10</button>
            <button type="button" data-time="0" class="time-opt py-2 rounded-lg border text-xs font-medium font-mono-clock"
                    style="border-color: var(--border-color); background-color: var(--bg-tertiary);">∞</button>
          </div>
        </div>

        <button id="btnConfirmCreateRoom" class="btn-primary w-full py-3 rounded-lg font-medium text-sm">
          Create Room
        </button>
      </div>
    </section>

    <!-- VIEW 3: WAITING ROOM / QUEUE / SHARE LINK -->
    <section id="viewWaiting" class="view-panel hidden w-full max-w-sm">
      <div class="surface-card rounded-xl p-6 text-center space-y-5">
        <div class="space-y-1">
          <h2 id="waitingTitle" class="text-base font-semibold">Waiting for opponent...</h2>
          <p id="waitingSubtitle" class="text-xs" style="color: var(--text-secondary);">Share the code or link below.</p>
        </div>

        <div id="shareBox" class="space-y-3 text-left">
          <div class="p-3 rounded-lg surface-sub flex items-center justify-between">
            <div>
              <span class="text-[11px] block" style="color: var(--text-secondary);">Room Code</span>
              <span id="displayRoomCode" class="text-base font-semibold font-mono-clock tracking-wider">------</span>
            </div>
            <button onclick="copyRoomCode()" class="btn-secondary px-3 py-1.5 rounded-md text-xs font-medium">Copy</button>
          </div>

          <div class="p-3 rounded-lg surface-sub space-y-2">
            <span class="text-[11px] block" style="color: var(--text-secondary);">Invite Link</span>
            <div class="flex gap-2">
              <input id="displayRoomLink" type="text" readonly
                class="w-full px-2.5 py-1.5 rounded-md text-xs font-mono-clock focus:outline-none"
                style="background-color: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border-color);" />
              <button onclick="copyRoomLink()" class="btn-primary px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap">Copy</button>
            </div>
          </div>
        </div>

        <button onclick="returnToMenu()" class="btn-secondary w-full py-2.5 rounded-lg text-xs font-medium">
          Cancel
        </button>
      </div>
    </section>

    <!-- VIEW 4: ACTIVE CHESS GAME -->
    <section id="viewGame" class="view-panel hidden w-full max-w-4xl">
      <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-4">

        <!-- Left / Center: Board + Player Bars -->
        <div class="flex flex-col items-center w-full max-w-[520px] space-y-2">

          <!-- Top Player Bar (Opponent) -->
          <div class="w-full surface-card rounded-lg px-3.5 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div id="topAvatar" class="w-7 h-7 rounded-md flex items-center justify-center surface-sub">
                <span class="w-3 h-3 rounded-full bg-neutral-900 border border-neutral-400"></span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span id="topName" class="text-sm font-medium">Opponent</span>
                  <span id="topTurnBadge" class="hidden text-[10px] font-semibold px-1.5 py-0.5 rounded"
                        style="background-color: var(--accent); color: var(--accent-text);">TURN</span>
                </div>
                <span id="topRoleLabel" class="text-[11px]" style="color: var(--text-secondary);">Black</span>
              </div>
            </div>
            <div id="topClock" class="font-mono-clock text-base font-semibold px-2.5 py-1 rounded-md surface-sub">10:00</div>
          </div>

          <!-- Responsive Chessboard -->
          <div class="board-wrapper" id="boardWrapper">
            <div id="chessGrid" class="chess-grid"></div>
            <div id="animLayer" class="anim-layer"></div>
          </div>

          <!-- Bottom Player Bar (You) -->
          <div class="w-full surface-card rounded-lg px-3.5 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div id="bottomAvatar" class="w-7 h-7 rounded-md flex items-center justify-center surface-sub">
                <span class="w-3 h-3 rounded-full bg-white border border-neutral-400"></span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span id="bottomName" class="text-sm font-medium">You</span>
                  <span id="bottomTurnBadge" class="hidden text-[10px] font-semibold px-1.5 py-0.5 rounded"
                        style="background-color: var(--accent); color: var(--accent-text);">TURN</span>
                </div>
                <span id="bottomRoleLabel" class="text-[11px]" style="color: var(--text-secondary);">White</span>
              </div>
            </div>
            <div id="bottomClock" class="font-mono-clock text-base font-semibold px-2.5 py-1 rounded-md surface-sub">10:00</div>
          </div>
        </div>

        <!-- Right Sidebar: Game Info, Spectator Banner, Controls & Move History -->
        <div class="w-full max-w-[520px] lg:w-72 surface-card rounded-xl p-4 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <!-- Mode / Spectator Status Banner -->
            <div id="gameRoleBanner" class="p-3 rounded-lg surface-sub flex items-center justify-between">
              <div>
                <span id="gameModeTitle" class="text-xs font-semibold block">Live Match</span>
                <span id="gameRoomTag" class="text-[11px] font-mono-clock" style="color: var(--text-secondary);">Room: LOCAL</span>
              </div>
              <span id="spectatorCountBadge" class="text-[11px] font-medium px-2 py-0.5 rounded inline-flex items-center gap-1.5"
                    style="background-color: var(--bg-primary); color: var(--text-secondary);">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span id="spectatorCountNum">0</span>
              </span>
            </div>

            <!-- Live Game Status Message -->
            <div id="gameStatusAlert" class="p-2.5 rounded-lg text-xs font-medium text-center"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary);">
              White to move
            </div>

            <!-- Move History List -->
            <div>
              <div class="text-[11px] font-medium mb-1.5" style="color: var(--text-secondary);">Moves</div>
              <div id="moveHistoryBox" class="h-44 lg:h-64 overflow-y-auto rounded-lg p-2 space-y-0.5 text-xs font-mono-clock surface-sub">
                <div class="text-center py-6 opacity-50">No moves yet</div>
              </div>
            </div>
          </div>

          <!-- Action Controls -->
          <div class="space-y-2 pt-2 border-t" style="border-color: var(--border-color);">
            <button id="btnShareInGame" onclick="copyRoomLink()" class="hidden btn-secondary w-full py-2 rounded-lg text-xs font-medium">
              Copy Invite Link
            </button>
            <div class="grid grid-cols-2 gap-2" id="playerControls">
              <button id="btnFlipBoard" onclick="flipBoardView()" class="btn-secondary py-2 rounded-lg text-xs font-medium">
                Flip Board
              </button>
              <button id="btnResign" onclick="resignGame()" class="py-2 rounded-lg text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/25 hover:bg-red-500/20">
                Resign
              </button>
            </div>
            <button onclick="returnToMenu()" class="btn-secondary w-full py-2 rounded-lg text-xs font-medium">
              Leave
            </button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Pawn Promotion Modal -->
  <div id="promotionModal" class="modal-backdrop hidden fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
    <div class="modal-box surface-card rounded-xl p-5 max-w-xs w-full text-center space-y-4">
      <h3 class="font-semibold text-sm">Promote Pawn</h3>
      <div class="grid grid-cols-4 gap-2" id="promotionChoices"></div>
    </div>
  </div>

  <!-- Game Over Modal -->

  <script>
    // =========================================================================
    // 1. LIGHT / DARK THEME CONTROLLER
    // =========================================================================
    const htmlRoot = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    const SUN_SVG = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    const MOON_SVG = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    function applyTheme(theme) {
      if (theme === 'light') {
        htmlRoot.classList.remove('dark');
        htmlRoot.classList.add('light');
        themeIcon.innerHTML = MOON_SVG;
        themeLabel.textContent = 'Dark';
      } else {
        htmlRoot.classList.remove('light');
        htmlRoot.classList.add('dark');
        themeIcon.innerHTML = SUN_SVG;
        themeLabel.textContent = 'Light';
      }
      localStorage.setItem('chessing_theme', theme);
    }

    const savedTheme = localStorage.getItem('chessing_theme') || 'dark';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const next = htmlRoot.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
    });

    // =========================================================================
    // 2. PROCEDURAL CHILL LO-FI MUSIC & TACTILE CHESS SFX (WEB AUDIO API)
    // =========================================================================
    class ChillAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = true; // Desired state: ON by default
        this.isRunningLoop = false;
        this.masterGain = null;
        this.compressor = null;
        this.sfxGain = null;
        this.stepTimer = null;
        this.step = 0;
        this.stepMs = 210; // ~71 BPM relaxed chill tempo

        // Lush, warm jazz-chill chord progression (Fmaj9 -> Em7 -> Dm9 -> Cmaj9)
        this.progression = [
          {
            root: 87.31, // F2
            chords: [174.61, 220.00, 261.63, 329.63, 392.00],
            scale: [523.25, 587.33, 659.25, 783.99, 880.00]
          },
          {
            root: 82.41, // E2
            chords: [164.81, 196.00, 246.94, 293.66, 392.00],
            scale: [493.88, 587.33, 659.25, 783.99, 987.77]
          },
          {
            root: 73.42, // D2
            chords: [146.83, 174.61, 220.00, 261.63, 329.63],
            scale: [523.25, 587.33, 659.25, 698.46, 880.00]
          },
          {
            root: 65.41, // C2
            chords: [130.81, 196.00, 246.94, 293.66, 329.63],
            scale: [493.88, 523.25, 587.33, 659.25, 783.99]
          }
        ];
      }

      initAudioNodes() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();

          // Soft dynamics compressor prevents clipping or popping when multiple notes overlap
          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
          this.compressor.knee.setValueAtTime(24, this.ctx.currentTime);
          this.compressor.ratio.setValueAtTime(4, this.ctx.currentTime);
          this.compressor.attack.setValueAtTime(0.015, this.ctx.currentTime);
          this.compressor.release.setValueAtTime(0.25, this.ctx.currentTime);
          this.compressor.connect(this.ctx.destination);

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
          this.masterGain.connect(this.compressor);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.setValueAtTime(0.22, this.ctx.currentTime);
          this.sfxGain.connect(this.compressor);
        }
      }

      playWarmPadChord(freqs, duration = 3.2) {
        if (!this.ctx || !this.isPlaying || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;

        freqs.forEach((freq, idx) => {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const noteGain = this.ctx.createGain();
          const lpFilter = this.ctx.createBiquadFilter();

          // Pure warm sine + subtle detuned chorus sine (no harsh harmonics or clicks)
          osc1.type = 'sine';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq, now);
          osc1.detune.setValueAtTime(-4, now);
          osc2.detune.setValueAtTime(4, now);

          lpFilter.type = 'lowpass';
          lpFilter.frequency.setValueAtTime(750, now);
          lpFilter.frequency.exponentialRampToValueAtTime(340, now + duration);

          const onset = now + idx * 0.045;
          // Long smooth attack & release eliminates any clicking/popping
          noteGain.gain.setValueAtTime(0.0001, onset);
          noteGain.gain.linearRampToValueAtTime(0.036, onset + 0.28);
          noteGain.gain.setValueAtTime(0.032, onset + duration * 0.55);
          noteGain.gain.exponentialRampToValueAtTime(0.0001, onset + duration);

          osc1.connect(lpFilter);
          osc2.connect(lpFilter);
          lpFilter.connect(noteGain);
          noteGain.connect(this.masterGain);

          osc1.start(onset);
          osc2.start(onset);
          osc1.stop(onset + duration + 0.08);
          osc2.stop(onset + duration + 0.08);
        });
      }

      playSmoothBass(freq, duration = 1.4) {
        if (!this.ctx || !this.isPlaying || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(180, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.09);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + duration + 0.08);
      }

      playBellPluck(freq) {
        if (!this.ctx || !this.isPlaying || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.frequency.exponentialRampToValueAtTime(420, now + 1.2);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.028, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 1.35);
      }

      playMellowPulse() {
        if (!this.ctx || !this.isPlaying || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(92, now);
        osc.frequency.exponentialRampToValueAtTime(46, now + 0.16);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.11, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      playSoftBrush() {
        if (!this.ctx || !this.isPlaying || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.09);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          // Hann-windowed smooth noise so there is zero click
          const env = Math.sin((Math.PI * i) / len);
          data[i] = (Math.random() * 2 - 1) * env;
        }

        const src = this.ctx.createBufferSource();
        src.buffer = buf;

        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 3200;
        bp.Q.value = 1.4;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.018, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.085);

        src.connect(bp);
        bp.connect(gain);
        gain.connect(this.masterGain);
        src.start(now);
      }

      tickSequencer() {
        if (!this.isPlaying || !this.ctx || this.ctx.state !== 'running') return;

        const barIndex = Math.floor(this.step / 16) % this.progression.length;
        const barStep = this.step % 16;
        const currentBar = this.progression[barIndex];

        // Lush warm electric piano chords
        if (barStep === 0) {
          this.playWarmPadChord(currentBar.chords, 2.6);
        } else if (barStep === 10) {
          this.playWarmPadChord(currentBar.chords.slice(1), 1.5);
        }

        // Smooth sub-bass movement
        if (barStep === 0) {
          this.playSmoothBass(currentBar.root, 1.5);
        } else if (barStep === 7) {
          this.playSmoothBass(currentBar.root * 1.5, 0.7);
        } else if (barStep === 10) {
          this.playSmoothBass(currentBar.root, 1.1);
        }

        // Gentle mellow pulse & brushed percussion
        if (barStep === 0 || barStep === 10) {
          this.playMellowPulse();
        }
        if (barStep === 4 || barStep === 12) {
          this.playSoftBrush();
        }

        // Gentle floating pentatonic notes
        const melodySteps = [2, 6, 9, 14];
        if (melodySteps.includes(barStep) && Math.random() < 0.55) {
          const note = currentBar.scale[Math.floor(Math.random() * currentBar.scale.length)];
          this.playBellPluck(note);
        }

        this.step = (this.step + 1) % (this.progression.length * 16);
      }

      async tryStart() {
        this.initAudioNodes();
        if (this.ctx.state === 'suspended') {
          try {
            await this.ctx.resume();
          } catch (e) {
            return false;
          }
        }
        if (this.ctx.state !== 'running' || !this.isPlaying) {
          return false;
        }

        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
        this.masterGain.gain.linearRampToValueAtTime(0.65, now + 0.8);

        if (!this.isRunningLoop) {
          this.isRunningLoop = true;
          this.tickSequencer();
          this.stepTimer = setInterval(() => this.tickSequencer(), this.stepMs);
        }
        return true;
      }

      async toggle() {
        if (!this.isPlaying) {
          this.isPlaying = true;
          await this.tryStart();
        } else {
          this.isPlaying = false;
          this.isRunningLoop = false;
          if (this.stepTimer) {
            clearInterval(this.stepTimer);
            this.stepTimer = null;
          }
          if (this.ctx && this.masterGain) {
            const now = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(now);
            this.masterGain.gain.setValueAtTime(Math.max(0.0001, this.masterGain.gain.value), now);
            this.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.35);
          }
        }
        return this.isPlaying;
      }

      playMoveSfx(type = 'move') {
        try {
          this.initAudioNodes();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          if (type === 'capture') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(190, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.12);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.28, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          } else if (type === 'check') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(587.33, now + 0.09);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
          } else {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(88, now + 0.08);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
          }

          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(now);
          osc.stop(now + 0.27);
        } catch (e) {}
      }
    }

    const audioEngine = new ChillAudioEngine();
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const musicEq = document.getElementById('musicEq');
    const musicBtnLabel = document.getElementById('musicBtnLabel');

    function updateMusicButtonUI(playing) {
      if (playing) {
        musicEq.classList.add('eq-active');
        musicBtnLabel.textContent = 'Music: On';
        musicToggleBtn.style.borderColor = 'var(--text-primary)';
      } else {
        musicEq.classList.remove('eq-active');
        musicBtnLabel.textContent = 'Music: Off';
        musicToggleBtn.style.borderColor = 'var(--border-color)';
      }
    }

    // Attempt immediate autoplay; if browser blocks until first gesture, start cleanly on any first interaction
    (async function setupDefaultMusic() {
      updateMusicButtonUI(true);
      const started = await audioEngine.tryStart();
      if (started) return;

      const onFirstInteraction = async (e) => {
        if (e && musicToggleBtn.contains(e.target)) return;
        if (!audioEngine.isPlaying) {
          cleanupListeners();
          return;
        }
        const ok = await audioEngine.tryStart();
        if (ok) cleanupListeners();
      };

      const cleanupListeners = () => {
        window.removeEventListener('pointerdown', onFirstInteraction, true);
        window.removeEventListener('mousedown', onFirstInteraction, true);
        window.removeEventListener('touchstart', onFirstInteraction, true);
        window.removeEventListener('keydown', onFirstInteraction, true);
      };

      window.addEventListener('pointerdown', onFirstInteraction, true);
      window.addEventListener('mousedown', onFirstInteraction, true);
      window.addEventListener('touchstart', onFirstInteraction, true);
      window.addEventListener('keydown', onFirstInteraction, true);
    })();

    musicToggleBtn.addEventListener('click', async () => {
      const playing = await audioEngine.toggle();
      updateMusicButtonUI(playing);
    });

    // =========================================================================
    // 4. APPLICATION STATE & CHESS ENGINE
    // =========================================================================
    const chess = new Chess();

    const state = {
      mode: 'lobby', // 'lobby' | 'local' | 'online_host' | 'online_guest' | 'spectator'
      myColor: 'w',  // 'w' or 'b'
      boardOrientation: 'w',
      selectedSquare: null,
      legalMoves: [],
      lastMove: null,
      timeLimit: 600, // seconds per player (0 = unlimited)
      clocks: { w: 600, b: 600 },
      clockInterval: null,
      gameOver: false,

      // Room creation settings
      setupColorChoice: 'w',
      setupTimeChoice: 600,

      // PeerJS multiplayer state
      peer: null,
      roomCode: null,
      hostConn: null,
      guestConn: null,
      spectatorConns: [],
      queueInterval: null,
      queueSlotIndex: 0
    };

    const QUEUE_SLOTS = 6; // Global matchmaking slots

    // =========================================================================
    // 5. UI HELPERS & NAVIGATION
    // =========================================================================
    function showView(viewId) {
      ['viewLobby', 'viewCreateRoom', 'viewWaiting', 'viewGame'].forEach(id => {
        const el = document.getElementById(id);
        if (id === viewId) {
          el.classList.remove('hidden');
          el.classList.remove('view-panel');
          void el.offsetWidth; // trigger reflow for clean animation replay
          el.classList.add('view-panel');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(box._timer);
      box._timer = setTimeout(() => box.classList.add('hidden'), 4200);
    }

    function cleanupNetwork() {
      if (state.queueInterval) {
        clearInterval(state.queueInterval);
        state.queueInterval = null;
      }
      if (state.clockInterval) {
        clearInterval(state.clockInterval);
        state.clockInterval = null;
      }
      if (state.hostConn) {
        try { state.hostConn.close(); } catch (e) {}
        state.hostConn = null;
      }
      if (state.guestConn) {
        try { state.guestConn.close(); } catch (e) {}
        state.guestConn = null;
      }
      state.spectatorConns.forEach(c => { try { c.close(); } catch (e) {} });
      state.spectatorConns = [];
      if (state.peer) {
        try { state.peer.destroy(); } catch (e) {}
        state.peer = null;
      }
      if (window.location.search.includes('room=')) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function returnToMenu() {
      cleanupNetwork();
      closeGameOverModal();
      document.getElementById('promotionModal').classList.add('hidden');
      state.mode = 'lobby';
      showView('viewLobby');
    }

    // =========================================================================
    // 6. CREATE ROOM OPTIONS UI
    // =========================================================================
    document.getElementById('btnOpenCreate').addEventListener('click', () => {
      showView('viewCreateRoom');
    });

    document.querySelectorAll('.color-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-opt').forEach(b => b.style.borderColor = 'var(--border-color)');
        btn.style.borderColor = 'var(--text-primary)';
        state.setupColorChoice = btn.dataset.color;
      });
    });

    document.querySelectorAll('.time-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-opt').forEach(b => b.style.borderColor = 'var(--border-color)');
        btn.style.borderColor = 'var(--text-primary)';
        state.setupTimeChoice = parseInt(btn.dataset.time, 10);
      });
    });

    document.getElementById('btnConfirmCreateRoom').addEventListener('click', () => {
      startPrivateHostRoom();
    });

    // =========================================================================
    // 7. LOCAL PASS & PLAY MODE
    // =========================================================================
    document.getElementById('btnLocalMode').addEventListener('click', () => {
      cleanupNetwork();
      state.mode = 'local';
      state.myColor = 'w';
      state.boardOrientation = 'w';
      state.timeLimit = 600;
      initMatchState();
      setupGameUI('Pass & Play', 'LOCAL', 0);
      showView('viewGame');
    });

    // =========================================================================
    // 8. PEERJS MULTIPLAYER (PRIVATE ROOMS, SPECTATORS & RANDOM QUEUE)
    // =========================================================================
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    function getInviteUrl(code) {
      const url = new URL(window.location.href);
      url.searchParams.set('room', code);
      return url.toString();
    }

    function copyRoomCode() {
      if (!state.roomCode) return;
      copyTextFallback(state.roomCode);
      showToast('Room code copied: ' + state.roomCode);
    }

    function copyRoomLink() {
      if (!state.roomCode) return;
      const link = getInviteUrl(state.roomCode);
      copyTextFallback(link);
      showToast('Invite link copied to clipboard!');
    }

    function copyTextFallback(text) {
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }

    // --- HOST PRIVATE ROOM ---
    function startPrivateHostRoom() {
      cleanupNetwork();
      const code = generateRoomCode();
      state.roomCode = code;
      state.mode = 'online_host';
      state.timeLimit = state.setupTimeChoice;

      if (state.setupColorChoice === 'random') {
        state.myColor = Math.random() < 0.5 ? 'w' : 'b';
      } else {
        state.myColor = state.setupColorChoice;
      }
      state.boardOrientation = state.myColor;

      document.getElementById('waitingTitle').textContent = 'Waiting for Opponent...';
      document.getElementById('waitingSubtitle').textContent = 'Share this code or link with your friend. Extra joiners become spectators.';
      document.getElementById('shareBox').classList.remove('hidden');
      document.getElementById('displayRoomCode').textContent = code;
      document.getElementById('displayRoomLink').value = getInviteUrl(code);
      showView('viewWaiting');

      const peerId = 'chessing-room-' + code;
      state.peer = new Peer(peerId);

      state.peer.on('error', (err) => {
        showToast('Connection error: ' + err.type + '. Please try again.');
        returnToMenu();
      });

      state.peer.on('connection', (conn) => {
        conn.on('open', () => {
          // 2nd person joins as opponent
          if (!state.guestConn) {
            state.guestConn = conn;
            const guestColor = state.myColor === 'w' ? 'b' : 'w';

            initMatchState();
            setupGameUI('Private Match', code, state.spectatorConns.length);
            showView('viewGame');

            conn.send({
              type: 'init',
              role: 'player',
              color: guestColor,
              timeLimit: state.timeLimit,
              fen: chess.fen(),
              clocks: state.clocks,
              history: chess.history(),
              lastMove: state.lastMove,
              spectatorCount: state.spectatorConns.length
            });

            attachHostConnectionListeners(conn, false);
          } else {
            // 3rd or more person joins -> Spectator Only!
            state.spectatorConns.push(conn);
            updateSpectatorBadge();
            broadcastStateToAll();

            conn.send({
              type: 'init',
              role: 'spectator',
              color: 'w',
              timeLimit: state.timeLimit,
              fen: chess.fen(),
              clocks: state.clocks,
              history: chess.history(),
              lastMove: state.lastMove,
              gameOver: state.gameOver,
              spectatorCount: state.spectatorConns.length
            });

            attachHostConnectionListeners(conn, true);
          }
        });
      });
    }

    function attachHostConnectionListeners(conn, isSpectator) {
      conn.on('data', (data) => {
        if (isSpectator) return;

        if (data.type === 'move') {
          const guestColor = state.myColor === 'w' ? 'b' : 'w';
          if (chess.turn() !== guestColor || state.gameOver) return;

          const moveObj = chess.move(data.move);
          if (moveObj) {
            state.lastMove = { from: moveObj.from, to: moveObj.to };
            animatePieceGlide(moveObj.from, moveObj.to, moveObj.color + moveObj.piece);
            playSfxForMove(moveObj);
            checkGameEndConditions();
            renderBoard();
            renderMoveHistory();
            updateTurnIndicators();
            broadcastStateToAll();
          }
        } else if (data.type === 'resign') {
          if (!state.gameOver) {
            const guestColor = state.myColor === 'w' ? 'b' : 'w';
            const winner = guestColor === 'w' ? 'Black' : 'White';
            endGame(`${winner} Wins!`, 'Opponent resigned the match.');
            broadcastStateToAll(`${winner} Wins!`, 'Opponent resigned the match.');
          }
        }
      });

      conn.on('close', () => {
        if (isSpectator) {
          state.spectatorConns = state.spectatorConns.filter(c => c !== conn);
          updateSpectatorBadge();
          broadcastStateToAll();
        } else {
          if (!state.gameOver) {
            const winner = state.myColor === 'w' ? 'White' : 'Black';
            endGame(`${winner} Wins!`, 'Opponent disconnected.');
            broadcastStateToAll(`${winner} Wins!`, 'Opponent disconnected.');
          }
          state.guestConn = null;
        }
      });
    }

    function broadcastStateToAll(overTitle = null, overDesc = null) {
      const payload = {
        type: 'sync',
        fen: chess.fen(),
        clocks: state.clocks,
        history: chess.history(),
        lastMove: state.lastMove,
        gameOver: state.gameOver,
        overTitle,
        overDesc,
        spectatorCount: state.spectatorConns.length
      };
      if (state.guestConn && state.guestConn.open) {
        state.guestConn.send(payload);
      }
      state.spectatorConns.forEach(c => {
        if (c.open) c.send(payload);
      });
    }

    // --- JOIN EXISTING ROOM (AS OPPONENT OR SPECTATOR) ---
    function joinRoomByCode(rawCode) {
      const code = rawCode.trim().toUpperCase();
      if (!code || code.length < 4) {
        showToast('Please enter a valid room code.');
        return;
      }

      cleanupNetwork();
      state.roomCode = code;

      document.getElementById('waitingTitle').textContent = 'Connecting to Room ' + code + '...';
      document.getElementById('waitingSubtitle').textContent = 'Joining match or entering spectator mode...';
      document.getElementById('shareBox').classList.add('hidden');
      showView('viewWaiting');

      state.peer = new Peer();

      state.peer.on('open', () => {
        const conn = state.peer.connect('chessing-room-' + code, { reliable: true });
        state.hostConn = conn;

        const timeout = setTimeout(() => {
          if (state.mode === 'lobby') {
            showToast('Room not found or host is offline.');
            returnToMenu();
          }
        }, 7000);

        conn.on('data', (data) => {
          clearTimeout(timeout);
          if (data.type === 'init') {
            state.timeLimit = data.timeLimit;
            chess.load(data.fen);
            state.clocks = data.clocks;
            state.lastMove = data.lastMove;
            state.gameOver = !!data.gameOver;

            if (data.role === 'player') {
              state.mode = 'online_guest';
              state.myColor = data.color;
              state.boardOrientation = data.color;
              setupGameUI('Private Match', code, data.spectatorCount || 0);
            } else {
              state.mode = 'spectator';
              state.myColor = null;
              state.boardOrientation = 'w';
              setupGameUI('Spectating Match', code, data.spectatorCount || 1);
              showToast('Room is full (2/2 players). You joined as a Spectator!');
            }

            startClockTicker();
            renderBoard();
            renderMoveHistoryFromList(data.history || []);
            updateTurnIndicators();
            showView('viewGame');
          } else if (data.type === 'sync') {
            const prevFen = chess.fen();
            chess.load(data.fen);
            if (prevFen !== data.fen && data.lastMove) {
              const movedPiece = chess.get(data.lastMove.to);
              if (movedPiece) {
                animatePieceGlide(data.lastMove.from, data.lastMove.to, movedPiece.color + movedPiece.type);
                playSfxForMove({ captured: false, san: '' });
              }
            }
            state.clocks = data.clocks;
            state.lastMove = data.lastMove;
            updateSpectatorBadge(data.spectatorCount);
            renderBoard();
            renderMoveHistoryFromList(data.history || []);
            updateTurnIndicators();

            if (data.gameOver && !state.gameOver) {
              endGame(data.overTitle || 'Game Over', data.overDesc || 'Match finished.');
            }
          }
        });

        conn.on('close', () => {
          if (!state.gameOver && state.mode !== 'lobby') {
            showToast('Host closed the room.');
            returnToMenu();
          }
        });
      });

      state.peer.on('error', () => {
        showToast('Could not connect to room ' + code + '.');
        returnToMenu();
      });
    }

    document.getElementById('btnJoinCode').addEventListener('click', () => {
      joinRoomByCode(document.getElementById('joinCodeInput').value);
    });

    // --- RANDOM MATCHMAKING QUEUE ---
    document.getElementById('btnQueue').addEventListener('click', () => {
      startRandomQueue();
    });

    function startRandomQueue() {
      cleanupNetwork();
      document.getElementById('waitingTitle').textContent = 'Searching for Opponent...';
      document.getElementById('waitingSubtitle').textContent = 'Matching you with another queued player (10 min Blitz)...';
      document.getElementById('shareBox').classList.add('hidden');
      showView('viewWaiting');

      state.queueSlotIndex = 0;
      tryNextQueueSlot();
    }

    function tryNextQueueSlot() {
      if (state.peer) {
        try { state.peer.destroy(); } catch (e) {}
        state.peer = null;
      }

      const slotId = 'chessing-global-queue-slot-' + state.queueSlotIndex;
      const peer = new Peer(slotId);
      state.peer = peer;

      peer.on('open', () => {
        // Successfully claimed this queue slot as Host — wait for another player to connect!
        state.mode = 'online_host';
        state.roomCode = 'QUEUE-' + (state.queueSlotIndex + 1);
        state.timeLimit = 600;
        state.myColor = Math.random() < 0.5 ? 'w' : 'b';
        state.boardOrientation = state.myColor;

        peer.on('connection', (conn) => {
          conn.on('open', () => {
            if (!state.guestConn) {
              state.guestConn = conn;
              const guestColor = state.myColor === 'w' ? 'b' : 'w';
              initMatchState();
              setupGameUI('Ranked Queue', 'LIVE', 0);
              showView('viewGame');

              conn.send({
                type: 'init',
                role: 'player',
                color: guestColor,
                timeLimit: 600,
                fen: chess.fen(),
                clocks: state.clocks,
                history: [],
                lastMove: null,
                spectatorCount: 0
              });
              attachHostConnectionListeners(conn, false);
            } else {
              conn.close();
            }
          });
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Someone is ALREADY waiting in this slot! Connect to them immediately to start the match!
          peer.destroy();
          connectToWaitingQueueHost(slotId);
        } else {
          showToast('Queue connection error. Retrying...');
          state.queueSlotIndex = (state.queueSlotIndex + 1) % QUEUE_SLOTS;
          setTimeout(tryNextQueueSlot, 800);
        }
      });
    }

    function connectToWaitingQueueHost(targetPeerId) {
      const guestPeer = new Peer();
      state.peer = guestPeer;

      guestPeer.on('open', () => {
        const conn = guestPeer.connect(targetPeerId, { reliable: true });
        state.hostConn = conn;

        const fallbackTimer = setTimeout(() => {
          if (state.mode !== 'online_guest') {
            state.queueSlotIndex = (state.queueSlotIndex + 1) % QUEUE_SLOTS;
            tryNextQueueSlot();
          }
        }, 3000);

        conn.on('data', (data) => {
          clearTimeout(fallbackTimer);
          if (data.type === 'init') {
            state.mode = 'online_guest';
            state.timeLimit = data.timeLimit;
            state.myColor = data.color;
            state.boardOrientation = data.color;
            chess.load(data.fen);
            state.clocks = data.clocks;
            state.lastMove = null;
            state.gameOver = false;

            setupGameUI('Ranked Queue', 'LIVE', 0);
            startClockTicker();
            renderBoard();
            renderMoveHistory();
            updateTurnIndicators();
            showView('viewGame');
          } else if (data.type === 'sync') {
            const prevFen = chess.fen();
            chess.load(data.fen);
            if (prevFen !== data.fen && data.lastMove) {
              const movedPiece = chess.get(data.lastMove.to);
              if (movedPiece) {
                animatePieceGlide(data.lastMove.from, data.lastMove.to, movedPiece.color + movedPiece.type);
                playSfxForMove({ captured: false, san: '' });
              }
            }
            state.clocks = data.clocks;
            state.lastMove = data.lastMove;
            renderBoard();
            renderMoveHistoryFromList(data.history || []);
            updateTurnIndicators();

            if (data.gameOver && !state.gameOver) {
              endGame(data.overTitle || 'Game Over', data.overDesc || 'Match finished.');
            }
          }
        });

        conn.on('close', () => {
          if (!state.gameOver && state.mode === 'online_guest') {
            endGame('Opponent Left', 'Your opponent disconnected from the queue match.');
          }
        });
      });
    }

    // =========================================================================
    // 9. CORE CHESS GAMEPLAY, SMOOTH PIECE ANIMATIONS & CLOCKS
    // =========================================================================
    function initMatchState() {
      chess.reset();
      state.selectedSquare = null;
      state.legalMoves = [];
      state.lastMove = null;
      state.gameOver = false;
      state.clocks = { w: state.timeLimit, b: state.timeLimit };
      startClockTicker();
      renderBoard();
      renderMoveHistory();
      updateTurnIndicators();
    }

    function setupGameUI(modeTitle, roomTag, specCount) {
      document.getElementById('gameModeTitle').textContent = modeTitle;
      document.getElementById('gameRoomTag').textContent = 'Room: ' + roomTag;
      updateSpectatorBadge(specCount);

      const shareBtn = document.getElementById('btnShareInGame');
      const playerCtrls = document.getElementById('playerControls');

      if (state.mode === 'online_host' || state.mode === 'online_guest') {
        shareBtn.classList.remove('hidden');
      } else {
        shareBtn.classList.add('hidden');
      }

      if (state.mode === 'spectator') {
        playerCtrls.innerHTML = `<button onclick="flipBoardView()" class="btn-secondary col-span-2 py-2 rounded-lg text-xs font-medium">Flip Board</button>`;
      } else {
        playerCtrls.innerHTML = `
          <button onclick="flipBoardView()" class="btn-secondary py-2 rounded-lg text-xs font-medium">Flip Board</button>
          <button onclick="resignGame()" class="py-2 rounded-lg text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/25 hover:bg-red-500/20">Resign</button>
        `;
      }

      updatePlayerLabels();
      updateClockDisplays();
    }

    function updateSpectatorBadge(count) {
      const c = typeof count === 'number' ? count : state.spectatorConns.length;
      document.getElementById('spectatorCountNum').textContent = c;
    }

    function updatePlayerLabels() {
      const bottomIsWhite = state.boardOrientation === 'w';
      const whiteDot = `<span class="w-3.5 h-3.5 rounded-full bg-white border border-slate-400"></span>`;
      const blackDot = `<span class="w-3.5 h-3.5 rounded-full bg-slate-900 border border-slate-400"></span>`;
      document.getElementById('bottomAvatar').innerHTML = bottomIsWhite ? whiteDot : blackDot;
      document.getElementById('topAvatar').innerHTML = bottomIsWhite ? blackDot : whiteDot;

      if (state.mode === 'local') {
        document.getElementById('bottomName').textContent = bottomIsWhite ? 'Player 1 (White)' : 'Player 2 (Black)';
        document.getElementById('topName').textContent = bottomIsWhite ? 'Player 2 (Black)' : 'Player 1 (White)';
        document.getElementById('bottomRoleLabel').textContent = bottomIsWhite ? 'White Pieces' : 'Black Pieces';
        document.getElementById('topRoleLabel').textContent = bottomIsWhite ? 'Black Pieces' : 'White Pieces';
      } else if (state.mode === 'spectator') {
        document.getElementById('bottomName').textContent = bottomIsWhite ? 'White Player' : 'Black Player';
        document.getElementById('topName').textContent = bottomIsWhite ? 'Black Player' : 'White Player';
        document.getElementById('bottomRoleLabel').textContent = 'Spectating';
        document.getElementById('topRoleLabel').textContent = 'Spectating';
      } else {
        const iAmBottom = state.myColor === state.boardOrientation;
        document.getElementById('bottomName').textContent = iAmBottom ? 'You' : 'Opponent';
        document.getElementById('topName').textContent = iAmBottom ? 'Opponent' : 'You';
        document.getElementById('bottomRoleLabel').textContent = bottomIsWhite ? 'White' : 'Black';
        document.getElementById('topRoleLabel').textContent = bottomIsWhite ? 'Black' : 'White';
      }
    }

    function flipBoardView() {
      state.boardOrientation = state.boardOrientation === 'w' ? 'b' : 'w';
      updatePlayerLabels();
      updateClockDisplays();
      updateTurnIndicators();
      renderBoard();
    }

    // Smooth visual glide of a piece from source square to destination square
    function animatePieceGlide(fromSq, toSq, pieceKey) {
      const animLayer = document.getElementById('animLayer');
      if (!animLayer || !PIECE_SVGS[pieceKey]) return;

      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const fromFileIdx = files.indexOf(fromSq[0]);
      const fromRankIdx = 8 - parseInt(fromSq[1], 10);
      const toFileIdx = files.indexOf(toSq[0]);
      const toRankIdx = 8 - parseInt(toSq[1], 10);

      const orient = state.boardOrientation;
      const startCol = orient === 'w' ? fromFileIdx : 7 - fromFileIdx;
      const startRow = orient === 'w' ? fromRankIdx : 7 - fromRankIdx;
      const endCol = orient === 'w' ? toFileIdx : 7 - toFileIdx;
      const endRow = orient === 'w' ? toRankIdx : 7 - toRankIdx;

      const flyer = document.createElement('div');
      flyer.style.position = 'absolute';
      flyer.style.width = '12.5%';
      flyer.style.height = '12.5%';
      flyer.style.left = (startCol * 12.5) + '%';
      flyer.style.top = (startRow * 12.5) + '%';
      flyer.style.display = 'flex';
      flyer.style.alignItems = 'center';
      flyer.style.justifyContent = 'center';
      flyer.style.transition = 'transform 0.24s cubic-bezier(0.22, 1, 0.36, 1)';
      flyer.innerHTML = PIECE_SVGS[pieceKey];

      animLayer.appendChild(flyer);

      const deltaX = (endCol - startCol) * 100;
      const deltaY = (endRow - startRow) * 100;

      requestAnimationFrame(() => {
        flyer.style.transform = `translate(${deltaX}%, ${deltaY}%) scale(1.06)`;
      });

      setTimeout(() => {
        if (flyer.parentNode) flyer.parentNode.removeChild(flyer);
      }, 250);
    }

    function playSfxForMove(moveObj) {
      if (chess.in_check()) {
        audioEngine.playMoveSfx('check');
      } else if (moveObj && moveObj.captured) {
        audioEngine.playMoveSfx('capture');
      } else {
        audioEngine.playMoveSfx('move');
      }
    }

    function renderBoard() {
      const grid = document.getElementById('chessGrid');
      grid.innerHTML = '';

      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

      const displayRanks = state.boardOrientation === 'w' ? ranks : [...ranks].reverse();
      const displayFiles = state.boardOrientation === 'w' ? files : [...files].reverse();

      const inCheck = chess.in_check();
      const turnColor = chess.turn();

      displayRanks.forEach((rank, rIdx) => {
        displayFiles.forEach((file, fIdx) => {
          const sqName = file + rank;
          const fileIdx = files.indexOf(file);
          const rankIdx = ranks.indexOf(rank);
          const isLight = (fileIdx + rankIdx) % 2 === 0;

          const sqEl = document.createElement('div');
          sqEl.className = `square ${isLight ? 'light' : 'dark'}`;
          sqEl.dataset.square = sqName;

          if (state.selectedSquare === sqName) {
            sqEl.classList.add('selected');
          }
          if (state.lastMove && (state.lastMove.from === sqName || state.lastMove.to === sqName)) {
            sqEl.classList.add('last-move');
          }

          const piece = chess.get(sqName);
          if (piece) {
            if (inCheck && piece.type === 'k' && piece.color === turnColor) {
              sqEl.classList.add('in-check');
            }
            sqEl.innerHTML += PIECE_SVGS[piece.color + piece.type];
          }

          // Legal move indicators
          const targetMove = state.legalMoves.find(m => m.to === sqName);
          if (targetMove) {
            const indicator = document.createElement('div');
            indicator.className = piece ? 'legal-capture-ring' : 'legal-dot';
            sqEl.appendChild(indicator);
          }

          // Coordinate labels on edges
          if (fIdx === 0) {
            const rSpan = document.createElement('span');
            rSpan.className = `coord-rank ${isLight ? 'text-sq-dark' : 'text-sq-light'}`;
            rSpan.textContent = rank;
            sqEl.appendChild(rSpan);
          }
          if (rIdx === 7) {
            const fSpan = document.createElement('span');
            fSpan.className = `coord-file ${isLight ? 'text-sq-dark' : 'text-sq-light'}`;
            fSpan.textContent = file;
            sqEl.appendChild(fSpan);
          }

          sqEl.addEventListener('click', () => handleSquareClick(sqName));
          grid.appendChild(sqEl);
        });
      });
    }

    function handleSquareClick(sqName) {
      if (state.gameOver || state.mode === 'spectator') return;

      const turn = chess.turn();
      if ((state.mode === 'online_host' || state.mode === 'online_guest') && turn !== state.myColor) {
        return; // Not your turn
      }

      // Check if clicking a legal destination square
      const chosenMove = state.legalMoves.find(m => m.to === sqName);
      if (chosenMove) {
        // Handle Pawn Promotion
        if (chosenMove.flags.includes('p')) {
          openPromotionModal(chosenMove.from, chosenMove.to, turn);
          return;
        }
        executeMove({ from: chosenMove.from, to: chosenMove.to });
        return;
      }

      // Otherwise, select own piece
      const clickedPiece = chess.get(sqName);
      if (clickedPiece && clickedPiece.color === turn) {
        if (state.selectedSquare === sqName) {
          state.selectedSquare = null;
          state.legalMoves = [];
        } else {
          state.selectedSquare = sqName;
          state.legalMoves = chess.moves({ square: sqName, verbose: true });
        }
      } else {
        state.selectedSquare = null;
        state.legalMoves = [];
      }
      renderBoard();
    }

    function openPromotionModal(from, to, color) {
      const modal = document.getElementById('promotionModal');
      const container = document.getElementById('promotionChoices');
      container.innerHTML = '';

      ['q', 'r', 'b', 'n'].forEach(pType => {
        const btn = document.createElement('button');
        btn.className = 'p-2 rounded-lg surface-sub flex items-center justify-center aspect-square';
        btn.innerHTML = PIECE_SVGS[color + pType];
        btn.onclick = () => {
          modal.classList.add('hidden');
          executeMove({ from, to, promotion: pType });
        };
        container.appendChild(btn);
      });

      modal.classList.remove('hidden');
    }

    function executeMove(moveInput) {
      const moveObj = chess.move(moveInput);
      if (!moveObj) return; // Strict validation: never allow invalid moves

      state.selectedSquare = null;
      state.legalMoves = [];
      state.lastMove = { from: moveObj.from, to: moveObj.to };

      animatePieceGlide(moveObj.from, moveObj.to, moveObj.color + moveObj.piece);
      playSfxForMove(moveObj);

      if (state.mode === 'local') {
        state.boardOrientation = chess.turn();
        updatePlayerLabels();
      }

      checkGameEndConditions();
      renderBoard();
      renderMoveHistory();
      updateTurnIndicators();

      if (state.mode === 'online_host') {
        broadcastStateToAll();
      } else if (state.mode === 'online_guest' && state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'move', move: moveInput });
      }
    }

    function checkGameEndConditions() {
      if (chess.in_checkmate()) {
        const winner = chess.turn() === 'w' ? 'Black' : 'White';
        endGame('Checkmate!', `${winner} wins the game.`);
        if (state.mode === 'online_host') broadcastStateToAll('Checkmate!', `${winner} wins the game.`);
      } else if (chess.in_stalemate()) {
        endGame('Draw — Stalemate', 'No legal moves remaining.');
        if (state.mode === 'online_host') broadcastStateToAll('Draw — Stalemate', 'No legal moves remaining.');
      } else if (chess.in_threefold_repetition()) {
        endGame('Draw — Repetition', 'Threefold repetition reached.');
        if (state.mode === 'online_host') broadcastStateToAll('Draw — Repetition', 'Threefold repetition reached.');
      } else if (chess.insufficient_material()) {
        endGame('Draw — Insufficient Material', 'Neither player can checkmate.');
        if (state.mode === 'online_host') broadcastStateToAll('Draw — Insufficient Material', 'Neither player can checkmate.');
      } else if (chess.in_draw()) {
        endGame('Draw', 'The game ended in a draw.');
        if (state.mode === 'online_host') broadcastStateToAll('Draw', 'The game ended in a draw.');
      }
    }

    function resignGame() {
      if (state.gameOver || state.mode === 'spectator') return;
      if (state.mode === 'online_guest' && state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'resign' });
        const winner = state.myColor === 'w' ? 'Black' : 'White';
        endGame(`${winner} Wins!`, 'You resigned the match.');
        return;
      }
      const loserColor = state.mode === 'local' ? chess.turn() : state.myColor;
      const winner = loserColor === 'w' ? 'Black' : 'White';
      endGame(`${winner} Wins!`, `${loserColor === 'w' ? 'White' : 'Black'} resigned.`);
      if (state.mode === 'online_host') {
        broadcastStateToAll(`${winner} Wins!`, `${loserColor === 'w' ? 'White' : 'Black'} resigned.`);
      }
    }

    function endGame(title, desc) {
      state.gameOver = true;
      if (state.clockInterval) {
        clearInterval(state.clockInterval);
        state.clockInterval = null;
      }
      document.getElementById('gameStatusAlert').textContent = `${title} — ${desc}`;
      document.getElementById('gameOverTitle').textContent = title;
      document.getElementById('gameOverDesc').textContent = desc;
      document.getElementById('gameOverModal').classList.remove('hidden');
      updateTurnIndicators();
    }

    function closeGameOverModal() {
      document.getElementById('gameOverModal').classList.add('hidden');
    }

    function updateTurnIndicators() {
      const turn = chess.turn();
      const statusEl = document.getElementById('gameStatusAlert');

      if (!state.gameOver) {
        const turnName = turn === 'w' ? 'White' : 'Black';
        statusEl.textContent = chess.in_check() ? `${turnName} is in CHECK!` : `${turnName} to move`;
      }

      const bottomColor = state.boardOrientation;
      const topColor = bottomColor === 'w' ? 'b' : 'w';

      const bottomBadge = document.getElementById('bottomTurnBadge');
      const topBadge = document.getElementById('topTurnBadge');

      if (state.gameOver) {
        bottomBadge.classList.add('hidden');
        topBadge.classList.add('hidden');
      } else {
        bottomBadge.classList.toggle('hidden', turn !== bottomColor);
        topBadge.classList.toggle('hidden', turn !== topColor);
      }
    }

    function renderMoveHistory() {
      renderMoveHistoryFromList(chess.history());
    }

    function renderMoveHistoryFromList(moves) {
      const box = document.getElementById('moveHistoryBox');
      if (!moves.length) {
        box.innerHTML = `<div class="text-center py-6 opacity-50">No moves yet</div>`;
        return;
      }

      let html = '';
      for (let i = 0; i < moves.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const wMove = moves[i] || '';
        const bMove = moves[i + 1] || '';
        html += `
          <div class="grid grid-cols-12 px-2 py-1 rounded hover:bg-white/5">
            <span class="col-span-3 opacity-50">${moveNum}.</span>
            <span class="col-span-4 font-semibold">${wMove}</span>
            <span class="col-span-5 font-semibold">${bMove}</span>
          </div>
        `;
      }
      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    // =========================================================================
    // 10. CHESS CLOCKS
    // =========================================================================
    function formatClock(sec) {
      if (state.timeLimit === 0) return '∞';
      const s = Math.max(0, sec);
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function updateClockDisplays() {
      const bottomColor = state.boardOrientation;
      const topColor = bottomColor === 'w' ? 'b' : 'w';
      document.getElementById('bottomClock').textContent = formatClock(state.clocks[bottomColor]);
      document.getElementById('topClock').textContent = formatClock(state.clocks[topColor]);
    }

    function startClockTicker() {
      if (state.clockInterval) clearInterval(state.clockInterval);
      updateClockDisplays();
      if (state.timeLimit === 0) return;

      state.clockInterval = setInterval(() => {
        if (state.gameOver || chess.history().length === 0) return;
        const activeColor = chess.turn();
        state.clocks[activeColor] = Math.max(0, state.clocks[activeColor] - 1);
        updateClockDisplays();

        if (state.clocks[activeColor] === 0 && state.mode !== 'online_guest' && state.mode !== 'spectator') {
          const winner = activeColor === 'w' ? 'Black' : 'White';
          endGame('Time Out!', `${winner} wins on time.`);
          if (state.mode === 'online_host') {
            broadcastStateToAll('Time Out!', `${winner} wins on time.`);
          }
        }
      }, 1000);
    }

    // =========================================================================
    // 11. AUTO-JOIN FROM URL INVITE LINK (?room=XXXXXX)
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        joinRoomByCode(roomParam);
      }
    });
  </script>
